{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<h1>Login</h1>

{% if error %}
    <p style="color: red;">{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    <div>
        <label>Phone:</label>
        <input type="text" name="username" required>
    </div>
    <br>
    <div>
        <label>Password:</label>
        <input type="password" name="password" required>
    </div>
    <br>
    <button type="submit">Login</button>
</form>
{% endblock %}
